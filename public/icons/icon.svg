<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="60%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="40%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#d49a00"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="114" fill="url(#bgGlow)"/>
  
  <!-- Inner Border Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Cinema Reel / Monogram Center -->
  <g filter="url(#subtleShadow)">
    <!-- Cinematic Aperture / Lens Rings -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGradient)" stroke-width="12" stroke-dasharray="24 12" opacity="0.9"/>
    <circle cx="256" cy="256" r="110" fill="#0d0d12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
    
    <!-- Central Star / Play Symbol -->
    <path d="M 225,185 L 325,256 L 225,327 Z" fill="url(#goldGradient)" />
  </g>
</svg>
